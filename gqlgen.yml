# go tool gqlgen generate
schema:
  - internal/gateway/transport/graphql/schema/*.graphqls

exec:
  filename: internal/gateway/transport/graphql/generated/generated.go
  package: generated

model:
  filename: internal/gateway/transport/graphql/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: internal/gateway/transport/graphql/resolver
  package: resolver
  filename_template: "{name}.resolvers.go"

omit_slice_element_pointers: false

models:
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
  Int:
    model:
      - github.com/99designs/gqlgen/graphql.Int32
